# Magic BI — deploy enxuto pro servidor de teste (demonstração/homologação
# com o contador). Diferente do docker-compose.yml (dev local, com Redis +
# worker): aqui CELERY_TASK_ALWAYS_EAGER=True roda as tasks inline, sem
# precisar de Redis/worker separados — servidor compartilhado com RAM/disco
# apertados (ver docs/magicbi-ondas-desenvolvimento.md). Reaproveita a
# instância Evolution já existente no mesmo servidor (projeto aosatende) via
# EVOLUTION_BASE_URL apontando pro host, não pro compose.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: magicbi
      POSTGRES_USER: magicbi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magicbi -d magicbi"]
      interval: 5s
      timeout: 3s
      retries: 10


  # Storage compatível com S3 dos documentos (Sprint 4).
  #
  # **Nenhuma porta publicada no host, e isso é decisão.** O Django alcança o
  # MinIO pela rede do compose (`http://minio:9000`); publicar a API S3 no host
  # abriria um endpoint de arquivos fiscais na internet e ainda disputaria porta
  # num servidor que hospeda projetos de vários outros clientes — a 9000 já está
  # ocupada pelo Portainer. Para abrir o console de administração, use túnel SSH:
  #
  #     ssh -L 9001:localhost:9001 root@servidor
  #     docker compose -f docker-compose.deploy.yml exec minio true  # confere que subiu
  #
  # A migração para a AWS não mexe aqui: remove-se este serviço e troca-se o
  # bloco S3_* do `.env`. A aplicação não sabe a diferença.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build: ./backend
    restart: unless-stopped
    command: sh -c "python manage.py collectstatic --noinput && python manage.py migrate && python manage.py runserver 0.0.0.0:8000 --insecure"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DATABASE_URL: postgres://magicbi:${POSTGRES_PASSWORD}@postgres:5432/magicbi
      CELERY_TASK_ALWAYS_EAGER: "True"
      GROQ_API_KEY: ${GROQ_API_KEY}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}
      MAGICLINK_SIGNING_KEY: ${MAGICLINK_SIGNING_KEY}
      PAINEL_BASE_URL: ${PAINEL_BASE_URL}
      EVOLUTION_BASE_URL: ${EVOLUTION_BASE_URL}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-no-reply@magicbi.local}
      # Sem EMAIL_HOST o Django cai no backend de console e o Magic Link do
      # contador fica só no log do container — ou seja, ele não consegue entrar.
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      # Storage de documentos. Sem estes três, o recebimento de arquivo é
      # recusado com aviso — nunca aceito e perdido.
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    ports:
      - "8020:8000"
    volumes:
      - media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  pgdata:
  media:
  minio:
