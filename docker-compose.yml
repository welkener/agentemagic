# Magic BI — MVP local (Django + Celery + Postgres + Redis)
# Uso: docker compose up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: magicbi
      POSTGRES_USER: magicbi
      POSTGRES_PASSWORD: magicbi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magicbi -d magicbi"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: ./backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment: &app_env
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-inseguro-troque-em-producao}
      DJANGO_DEBUG: "True"
      DATABASE_URL: postgres://magicbi:magicbi@postgres:5432/magicbi
      REDIS_URL: redis://redis:6379/0
      META_APP_SECRET: ${META_APP_SECRET:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Filas por prioridade (DEC-10). Dois workers, e não um escutando as três:
  # com um só, o Celery reveza entre as filas e um lote de documentos volta a
  # empurrar a emissão fiscal para trás — que é justamente o que separar as
  # filas veio impedir. Worker separado é a única forma de reservar capacidade.
  worker-fiscal:
    build: ./backend
    # `conversa` junto porque as duas são interativas e hoje têm volume baixo;
    # `-Q fiscal,conversa` nesta ordem faz o fiscal ser servido primeiro.
    command: celery -A config worker -l info -Q fiscal,conversa --concurrency=4
    environment: *app_env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-documento:
    build: ./backend
    # Concorrência menor de propósito: OCR e importação são pesados de CPU e
    # memória, e o servidor é compartilhado com outros projetos.
    command: celery -A config worker -l info -Q documento --concurrency=2
    environment: *app_env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
