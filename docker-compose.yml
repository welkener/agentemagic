# Magic BI — MVP local (Django + Celery + Postgres + Redis)
# Uso: docker compose up --build
#
# ⚠ **Este arquivo é de DESENVOLVIMENTO. O servidor de teste usa
# `docker-compose.deploy.yml`** — que publica 8020 (a porta que o Nginx Proxy
# Manager procura), roda o Celery inline e lê os segredos do `.env`.
#
#     docker compose -f docker-compose.deploy.yml up -d --build
#
# O aviso está aqui porque o erro já foi cometido: em 09/ago/2026 o deploy do
# Sprint 2 subiu o servidor por este arquivo. O resultado foi o site fora do ar
# com 504 (a porta publicada virou 8000 e o proxy aponta para 8020) e o web sem
# conectar ao banco (senha diferente da do `.env`). Nada disso aparece em quem
# só reinicia o contêiner existente — o efeito só surge quando ele é recriado.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: magicbi
      POSTGRES_USER: magicbi
      # Lê do `.env`, com `magicbi` de padrão para o desenvolvimento local — a
      # mesma forma que `docker-compose.deploy.yml` usa. Estava cravado, e um
      # arquivo dizendo uma senha enquanto o outro diz outra é armadilha para
      # quem trocar de arquivo sem perceber.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-magicbi}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magicbi -d magicbi"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10


  # Storage compatível com S3 para os documentos do cliente (Sprint 4).
  #
  # MinIO fala a MESMA API da AWS S3 — é isso que torna a migração para a
  # Amazon uma troca de variável de ambiente, e não de código. Ver
  # `apps/documentos/armazenamento.py` e o bloco S3_* em `config/settings.py`.
  #
  # As credenciais de desenvolvimento são fracas de propósito e só valem aqui;
  # no servidor elas vêm do `.env` (ver docker-compose.deploy.yml).
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-magicbi}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-magicbi-dev-secret}
    volumes:
      - minio:/data
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # console web
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: ./backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment: &app_env
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-inseguro-troque-em-producao}
      DJANGO_DEBUG: "True"
      DATABASE_URL: postgres://magicbi:${POSTGRES_PASSWORD:-magicbi}@postgres:5432/magicbi
      REDIS_URL: redis://redis:6379/0
      META_APP_SECRET: ${META_APP_SECRET:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # O endpoint aponta para o serviço do compose; na AWS este valor some.
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-magicbi}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-magicbi-dev-secret}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Filas por prioridade (DEC-10). Dois workers, e não um escutando as três:
  # com um só, o Celery reveza entre as filas e um lote de documentos volta a
  # empurrar a emissão fiscal para trás — que é justamente o que separar as
  # filas veio impedir. Worker separado é a única forma de reservar capacidade.
  worker-fiscal:
    build: ./backend
    # `conversa` junto porque as duas são interativas e hoje têm volume baixo;
    # `-Q fiscal,conversa` nesta ordem faz o fiscal ser servido primeiro.
    command: celery -A config worker -l info -Q fiscal,conversa --concurrency=4
    environment: *app_env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-documento:
    build: ./backend
    # Concorrência menor de propósito: OCR e importação são pesados de CPU e
    # memória, e o servidor é compartilhado com outros projetos.
    command: celery -A config worker -l info -Q documento --concurrency=2
    environment: *app_env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  minio:
